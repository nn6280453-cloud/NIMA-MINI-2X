<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIMAH FAMILY BOT 1V</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020617;
    --panel:rgba(10,18,34,0.7);
    --accent:#38bdf8;
    --accent-2:#22d3ee;
    --accent-3:#0284c7;
    --accent-soft:rgba(56,189,248,0.12);
    --line:rgba(56,189,248,0.16);
    --line-2:rgba(56,189,248,0.32);
    --txt:#e6f2ff;
    --txt-2:#a8bdd6;
    --muted:#5c7a9c;
    --muted-2:#3d5470;
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
    --gold:#facc15;
  }

  * {
    margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html, body { height:100%; overflow-x:hidden; }

  body {
    font-family:'Inter', system-ui, sans-serif;
    background:var(--bg);
    color:var(--txt);
    line-height:1.5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px 50px;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============================================================
     AMBIENT BACKGROUND
  ============================================================ */
  .ambient { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  .aurora { position:absolute; border-radius:50%; filter:blur(120px); }
  .aurora-1 {
    width:900px; height:900px; top:-400px; left:-300px;
    background:radial-gradient(circle, #0ea5e9 0%, transparent 65%);
    opacity:0.5; animation:drift 30s ease-in-out infinite;
  }
  .aurora-2 {
    width:800px; height:800px; bottom:-400px; right:-250px;
    background:radial-gradient(circle, #0284c7 0%, transparent 65%);
    opacity:0.4; animation:drift 36s ease-in-out infinite reverse;
  }
  .aurora-3 {
    width:600px; height:600px; top:50%; left:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, #22d3ee 0%, transparent 68%);
    opacity:0.25; animation:drift 42s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { transform:translate(0,0) scale(1); }
    50%     { transform:translate(60px,40px) scale(1.12); }
  }

  /* Radial mesh */
  .mesh {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(34,211,238,0.06), transparent 45%),
      radial-gradient(circle at 40% 90%, rgba(2,132,199,0.10), transparent 40%);
  }

  .noise {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    opacity:0.32; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  }

  /* Fine dotted grid */
  .dots-grid {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(56,189,248,0.12) 1px, transparent 1px);
    background-size:32px 32px;
    mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, black 20%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, black 20%, transparent 75%);
  }

  .spotlight {
    position:fixed; top:-15%; left:50%; transform:translateX(-50%);
    width:1200px; height:800px;
    background:radial-gradient(ellipse at top, rgba(56,189,248,0.12), transparent 55%);
    filter:blur(40px); z-index:0; pointer-events:none;
  }

  /* ============================================================
     FLOATING DECORATIVE SYMBOLS (කෑලි බෑලි)
  ============================================================ */
  .deco {
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }

  .deco span {
    position:absolute;
    color:rgba(125,211,252,0.30);
    font-size:0.72rem;
    animation:float 14s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(56,189,248,0.5));
  }

  .deco span:nth-child(1)  { top:8%;  left:6%;   animation-delay:0s;    font-size:0.65rem; }
  .deco span:nth-child(2)  { top:18%; right:8%;  animation-delay:1.5s;  font-size:0.85rem; color:rgba(56,189,248,0.35); }
  .deco span:nth-child(3)  { top:38%; left:4%;   animation-delay:2.5s;  font-size:0.55rem; }
  .deco span:nth-child(4)  { top:62%; right:6%;  animation-delay:0.8s;  font-size:0.7rem;  color:rgba(34,211,238,0.35); }
  .deco span:nth-child(5)  { bottom:14%; left:7%; animation-delay:3.2s; font-size:0.9rem; }
  .deco span:nth-child(6)  { bottom:8%; right:9%; animation-delay:1.2s; font-size:0.6rem; }
  .deco span:nth-child(7)  { top:28%; right:16%; animation-delay:4s;    font-size:0.5rem;  color:rgba(250,204,21,0.35); }
  .deco span:nth-child(8)  { bottom:26%; left:12%; animation-delay:2s;  font-size:0.55rem; color:rgba(56,189,248,0.4); }
  .deco span:nth-child(9)  { top:52%; left:14%; animation-delay:5s;     font-size:0.6rem; }
  .deco span:nth-child(10) { top:72%; right:14%; animation-delay:3.6s;  font-size:0.7rem;  color:rgba(34,211,238,0.35); }

  @keyframes float {
    0%,100% { transform:translateY(0) rotate(0deg); opacity:0.5; }
    50%     { transform:translateY(-22px) rotate(15deg); opacity:1; }
  }

  /* Rising sparkles */
  .dust { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .dust span {
    position:absolute;
    width:2px; height:2px;
    background:rgba(186,230,253,0.7);
    border-radius:50%;
    box-shadow:0 0 8px rgba(125,211,252,0.9);
    animation:rise linear infinite;
    opacity:0;
  }
  @keyframes rise {
    0%   { transform:translateY(100vh); opacity:0; }
    12%  { opacity:0.85; }
    88%  { opacity:0.85; }
    100% { transform:translateY(-10vh); opacity:0; }
  }

  /* ============================================================
     PAGE WRAPPER
  ============================================================ */
  .page {
    position:relative;
    z-index:10;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes enter {
    from { opacity:0; transform:translateY(24px); filter:blur(8px); }
    to   { opacity:1; transform:translateY(0); filter:blur(0); }
  }

  /* ============================================================
     BRAND
  ============================================================ */
  .brand {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
    position:relative;
  }

  .brand::before {
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:380px; height:380px;
    background:radial-gradient(circle, rgba(56,189,248,0.30) 0%, rgba(56,189,248,0.08) 40%, transparent 70%);
    filter:blur(35px);
    z-index:-1;
    animation:breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%,100% { opacity:0.7; transform:translateX(-50%) scale(1); }
    50%     { opacity:1;   transform:translateX(-50%) scale(1.08); }
  }

  /* ---- LOGO FRAME with ornaments ---- */
  .logo-frame {
    position:relative;
    width:128px;
    height:128px;
    margin-bottom:22px;
    display:grid;
    place-items:center;
  }

  .logo-frame svg.ring {
    position:absolute;
    inset:0;
    width:100%; height:100%;
    transform:rotate(-90deg);
  }

  .logo-frame svg.ring circle { fill:none; stroke-linecap:round; }
  .logo-frame .track { stroke:rgba(56,189,248,0.10); stroke-width:1; }
  .logo-frame .progress {
    stroke:url(#grad1);
    stroke-width:1.5;
    stroke-dasharray:377;
    stroke-dashoffset:377;
    animation:drawRing 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }
  @keyframes drawRing { to { stroke-dashoffset:95; } }

  /* Decorative corner stars around logo */
  .logo-frame .orn {
    position:absolute;
    color:var(--accent);
    font-size:0.6rem;
    opacity:0.6;
    filter:drop-shadow(0 0 6px var(--accent));
    animation:twinkle 3s ease-in-out infinite;
  }
  .logo-frame .orn.tl { top:2px; left:6px; }
  .logo-frame .orn.tr { top:2px; right:6px; animation-delay:0.7s; }
  .logo-frame .orn.bl { bottom:2px; left:6px; animation-delay:1.4s; }
  .logo-frame .orn.br { bottom:2px; right:6px; animation-delay:2.1s; }

  @keyframes twinkle {
    0%,100% { opacity:0.35; transform:scale(0.9); }
    50%     { opacity:1;    transform:scale(1.15); }
  }

  /* rotating outer ring */
  .logo-frame::after {
    content:'';
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1px dashed rgba(56,189,248,0.22);
    animation:spin 24s linear infinite;
    pointer-events:none;
  }

  @keyframes spin { to { transform:rotate(360deg); } }

  .logo {
    width:100px; height:100px;
    border-radius:50%;
    overflow:hidden;
    position:relative;
    background:linear-gradient(145deg, #0c1e38, #061321);
    box-shadow:
      0 24px 60px -22px rgba(14,165,233,0.9),
      0 0 60px -15px rgba(56,189,248,0.55),
      inset 0 0 0 1px rgba(125,211,252,0.20);
    z-index:2;
  }

  .logo img { width:100%; height:100%; object-fit:cover; display:block; }

  .logo::after {
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    background:linear-gradient(160deg, rgba(255,255,255,0.18) 0%, transparent 32%, transparent 68%, rgba(56,189,248,0.12) 100%);
    pointer-events:none;
  }

  /* Status badge */
  .logo-frame .badge {
    position:absolute;
    bottom:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--bg);
    display:grid; place-items:center;
    z-index:3;
    box-shadow:0 0 0 3px var(--bg), 0 0 20px rgba(52,211,153,0.6);
  }
  .logo-frame .badge span {
    width:12px; height:12px;
    border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 10px var(--ok);
    position:relative;
  }
  .logo-frame .badge span::after {
    content:'';
    position:absolute;
    inset:-3px;
    border-radius:50%;
    background:var(--ok);
    opacity:0.6;
    animation:ping 2s cubic-bezier(0,0,0.2,1) infinite;
  }
  @keyframes ping {
    0%   { transform:scale(1); opacity:0.6; }
    100% { transform:scale(2.4); opacity:0; }
  }

  /* ---- BRAND TITLE ---- */
  .brand-title {
    font-family:'Inter', sans-serif;
    font-size:1.42rem;
    font-weight:600;
    letter-spacing:-0.028em;
    color:#ffffff;
    text-align:center;
    line-height:1.15;
    margin-bottom:10px;
  }

  .brand-title em {
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    background:linear-gradient(120deg, #7dd3fc 0%, #38bdf8 50%, #22d3ee 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    padding:0 2px;
  }

  /* ---- ORNAMENTAL DIVIDER ---- */
  .orn-divider {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:2px 0 8px;
    width:100%;
    max-width:260px;
  }

  .orn-divider .line {
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(56,189,248,0.5), transparent);
  }

  .orn-divider .line.rev {
    background:linear-gradient(90deg, transparent, rgba(56,189,248,0.5), transparent);
  }

  .orn-divider .gem {
    color:var(--accent);
    font-size:0.55rem;
    filter:drop-shadow(0 0 8px var(--accent));
    animation:gemPulse 2.4s ease-in-out infinite;
  }

  .orn-divider .gem.center {
    font-size:0.7rem;
    color:#7dd3fc;
    animation-delay:0.3s;
  }

  @keyframes gemPulse {
    0%,100% { opacity:0.6; transform:scale(0.95); }
    50%     { opacity:1;   transform:scale(1.1); }
  }

  /* ---- BRAND TAG (with side stars) ---- */
  .brand-tag {
    font-family:'JetBrains Mono', monospace;
    font-size:0.66rem;
    font-weight:500;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-tag .star {
    color:var(--accent);
    font-size:0.55rem;
    opacity:0.7;
    filter:drop-shadow(0 0 6px var(--accent));
  }

  /* ============================================================
     CARD with ORNAMENTAL FRAME
  ============================================================ */
  .card-wrap {
    position:relative;
    width:100%;
    padding:6px;
  }

  /* outer dashed frame */
  .card-wrap::before {
    content:'';
    position:absolute;
    inset:0;
    border-radius:28px;
    border:1px dashed rgba(56,189,248,0.18);
    pointer-events:none;
  }

  /* outer corner ornaments on the dashed frame */
  .card-wrap .frame-corner {
    position:absolute;
    width:14px; height:14px;
    border-color:var(--accent);
    border-style:solid;
    border-width:0;
    opacity:0.7;
    filter:drop-shadow(0 0 6px var(--accent));
  }
  .card-wrap .frame-corner.tl { top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; border-top-left-radius:14px; }
  .card-wrap .frame-corner.tr { top:-1px; right:-1px; border-top-width:2px; border-right-width:2px; border-top-right-radius:14px; }
  .card-wrap .frame-corner.bl { bottom:-1px; left:-1px; border-bottom-width:2px; border-left-width:2px; border-bottom-left-radius:14px; }
  .card-wrap .frame-corner.br { bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px; border-bottom-right-radius:14px; }

  .card {
    width:100%;
    position:relative;
    padding:32px 30px 30px;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(11,20,38,0.82) 0%, rgba(6,13,26,0.95) 100%);
    backdrop-filter:blur(40px) saturate(160%);
    -webkit-backdrop-filter:blur(40px) saturate(160%);
    border:1px solid rgba(56,189,248,0.12);
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.04) inset,
      0 30px 80px -20px rgba(0,0,0,0.85),
      0 0 100px -40px rgba(14,165,233,0.45);
    overflow:hidden;
  }

  /* top center gem */
  .card::before {
    content:'';
    position:absolute;
    top:0; left:50%;
    transform:translate(-50%, -50%);
    width:5px; height:5px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:
      0 0 12px var(--accent),
      0 0 24px var(--accent-2),
      0 0 0 3px rgba(6,13,26,0.9);
    z-index:3;
  }

  /* top gradient line */
  .card::after {
    content:'';
    position:absolute;
    top:0; left:15%; right:15%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(125,211,252,0.7), transparent);
  }

  /* inner deco dots */
  .card .inner-dot {
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:rgba(125,211,252,0.4);
    box-shadow:0 0 6px rgba(56,189,248,0.8);
    z-index:2;
  }
  .card .inner-dot.d1 { top:8px; left:22%; }
  .card .inner-dot.d2 { top:8px; right:22%; }

  /* ============================================================
     STEPS
  ============================================================ */
  .steps {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:26px;
    padding-bottom:22px;
    position:relative;
  }

  /* dotted divider under steps */
  .steps::after {
    content:'';
    position:absolute;
    bottom:0; left:20%; right:20%;
    height:1px;
    background-image:linear-gradient(90deg, rgba(56,189,248,0.4) 30%, transparent 30%);
    background-size:8px 1px;
    background-repeat:repeat-x;
    opacity:0.6;
  }

  .step {
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.6rem;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted-2);
    transition:color 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .step .dot {
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(56,189,248,0.15);
    transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .step.active { color:var(--accent); }
  .step.active .dot {
    background:var(--accent);
    box-shadow:0 0 12px var(--accent), 0 0 4px var(--accent);
    transform:scale(1.2);
  }

  .step.done { color:var(--ok); }
  .step.done .dot {
    background:var(--ok);
    box-shadow:0 0 10px var(--ok);
  }

  .step-sep {
    width:18px; height:1px;
    background:rgba(56,189,248,0.15);
  }

  /* ============================================================
     FIELD
  ============================================================ */
  .field-label {
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size:0.62rem;
    font-weight:500;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
    padding-left:2px;
  }

  .field-label .lbl-side {
    display:flex;
    align-items:center;
    gap:6px;
  }

  .field-label .lbl-side i {
    color:var(--accent);
    font-size:0.55rem;
    opacity:0.7;
  }

  .field-label .count {
    color:var(--accent);
    font-weight:600;
    transition:color 0.3s;
  }

  .field {
    position:relative;
    display:flex;
    align-items:stretch;
    height:64px;
    border-radius:16px;
    background:rgba(2,6,23,0.6);
    border:1px solid rgba(56,189,248,0.12);
    transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
    overflow:hidden;
  }

  .field:focus-within {
    border-color:rgba(56,189,248,0.55);
    background:rgba(2,6,23,0.9);
    box-shadow:
      0 0 0 4px rgba(56,189,248,0.08),
      0 0 40px -10px rgba(56,189,248,0.6);
  }

  .field::after {
    content:'';
    position:absolute;
    bottom:0; left:50%;
    width:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    transition:all 0.5s cubic-bezier(0.16,1,0.3,1);
    transform:translateX(-50%);
  }

  .field:focus-within::after {
    width:80%;
    box-shadow:0 0 20px var(--accent);
  }

  .field .prefix {
    display:flex;
    align-items:center;
    padding:0 8px 0 20px;
    color:var(--accent);
    font-size:0.92rem;
    opacity:0.75;
    transition:opacity 0.3s;
  }

  .field:focus-within .prefix { opacity:1; }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

  #number {
    -moz-appearance:textfield; appearance:textfield;
    flex:1; min-width:0;
    border:none; outline:none; background:transparent;
    color:#ffffff;
    font-family:'JetBrains Mono', monospace;
    font-size:1rem;
    font-weight:500;
    letter-spacing:0.01em;
    padding:0 12px 0 14px;
  }

  #number::placeholder { color:var(--muted-2); font-weight:400; letter-spacing:0.03em; }

  #submit {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:0 24px;
    margin:5px;
    border:none;
    border-radius:12px;
    background:linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    color:#ffffff;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:0.78rem;
    letter-spacing:0.04em;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:all 0.25s cubic-bezier(0.16,1,0.3,1);
    box-shadow:
      0 8px 24px -8px rgba(14,165,233,0.9),
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 -1px 0 rgba(0,0,0,0.25) inset;
    white-space:nowrap;
  }

  #submit::before {
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.22), transparent 45%);
    pointer-events:none;
  }

  #submit:hover {
    filter:brightness(1.12);

<script>
const input = document.getElementById("number");
const submitBtn = document.getElementById("submit");
const result = document.getElementById("result");
const counter = document.getElementById("counter");
const audio = document.getElementById("bgAudio");
const soundBtn = document.getElementById("soundBtn");
const soundIcon = document.getElementById("soundIcon");
const toastZone = document.getElementById("toastZone");

/* ============ SOUND ============ */
let ctx = null;
function ensureAudio() {
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ctx && ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(freq, dur, type, vol) {
  const c = ensureAudio();
  if (!c) return;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime);
  g.gain.linearRampToValueAtTime(vol || 0.04, c.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.connect(g).connect(c.destination);
  o.start();
  o.stop(c.currentTime + dur + 0.02);
}
function sfxTap()     { tone(560, 0.06, 'sine', 0.03); }
function sfxSuccess() { tone(660,0.10,'sine',0.05); setTimeout(()=>tone(880,0.12,'sine',0.05),85); setTimeout(()=>tone(1100,0.16,'sine',0.05),190); }
function sfxError()   { tone(200,0.14,'square',0.03); setTimeout(()=>tone(150,0.16,'square',0.03),90); }
function sfxCopy()    { tone(900,0.05,'triangle',0.03); setTimeout(()=>tone(1200,0.06,'triangle',0.03),55); }

/* ============ TOAST ============ */
function toast(type, text) {
  const icons = { ok:'fa-circle-check', err:'fa-circle-xmark', warn:'fa-triangle-exclamation', info:'fa-circle-info' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${text}</span>`;
  toastZone.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 400);
  }, 3000);
}

/* ============ SOUND TOGGLE ============ */
soundBtn.addEventListener("click", async () => {
  sfxTap();
  try {
    if (audio.paused) {
      await audio.play();
      soundIcon.classList.replace("fa-volume-mute", "fa-volume-up");
    } else {
      audio.pause();
      soundIcon.classList.replace("fa-volume-up", "fa-volume-mute");
    }
  } catch(e) {}
});

window.addEventListener("load", async () => {
  try {
    await audio.play();
    soundIcon.classList.replace("fa-volume-mute", "fa-volume-up");
  } catch(e) {
    soundIcon.classList.add("fa-volume-mute");
  }
});

/* ============ STEPS ============ */
function setStep(n) {
  document.querySelectorAll('.step').forEach(s => {
    const sn = parseInt(s.dataset.step, 10);
    s.classList.toggle('active', sn === n);
    s.classList.toggle('done', sn < n);
  });
}

/* ============ COUNTER ============ */
input.addEventListener("input", () => {
  const len = (input.value || "").replace(/[^0-9]/g, "").length;
  counter.textContent = `${Math.min(len, 15)} / 15`;
  counter.style.color = len >= 8 ? '#34d399' : (len > 0 ? '#fbbf24' : '#38bdf8');
});

/* ============ SUBMIT ============ */
submitBtn.addEventListener("click", async () => {
  const raw = (input.value || "").replace(/[^0-9]/g, "");

  if (!raw || raw.length < 8) {
    sfxError();
    result.innerHTML = `<div class="error"><i class="fas fa-circle-exclamation"></i>Enter a valid WhatsApp number</div>`;
    toast('warn', 'Invalid number');
    input.focus();
    return;
  }

  sfxTap();
  input.value = "+" + raw;
  result.innerHTML = `<div class="loading">Generating code<span class="dots"><span></span><span></span><span></span></span></div>`;
  submitBtn.disabled = true;
  setStep(2);

  try {
    const { data } = await axios(`/code?number=${raw}`);
    const code = data.code || data.error || "Service Unavailable";

    result.innerHTML = `
      <div class="success" id="successCard" role="button" tabindex="0">
        <span class="sc tl"><i class="fas fa-star"></i></span>
        <span class="sc tr"><i class="fas fa-star"></i></span>
        <span class="sc bl"><i class="fas fa-star"></i></span>
        <span class="sc br"><i class="fas fa-star"></i></span>
        <div class="label">
          <span class="gem"><i class="fas fa-gem"></i></span>
          Pairing Code
          <span class="gem"><i class="fas fa-gem"></i></span>
        </div>
        <div class="code">${code}</div>
        <div class="hint">Tap to copy</div>
      </div>
    `;

    const successCard = document.getElementById("successCard");
    successCard.addEventListener("click", () => copyCode(successCard, code));
    successCard.addEventListener("keypress", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copyCode(successCard, code); }
    });

    setStep(3);
    sfxSuccess();
    toast('ok', 'Code generated');
  } catch (err) {
    console.error(err);
    result.innerHTML = `<div class="error"><i class="fas fa-circle-xmark"></i>Service unavailable, try again</div>`;
    sfxError();
    toast('err', 'Request failed');
    setStep(1);
  } finally {
    submitBtn.disabled = false;
  }
});

/* ============ COPY ============ */
async function copyCode(card, code) {
  try {
    await navigator.clipboard.writeText(code);
    sfxCopy();
    toast('ok', 'Copied to clipboard');
    const label = card.querySelector('.label');
    const hint = card.querySelector('.hint');
    const originalLabel = label.innerHTML;

    card.classList.add('copied');
    label.innerHTML = '<i class="fas fa-check"></i> Copied';
    hint.textContent = 'Saved';

    setTimeout(() => {
      card.classList.remove('copied');
      label.innerHTML = originalLabel;
      hint.textContent = 'Tap to copy';
    }, 1400);
  } catch (e) {
    toast('err', 'Copy failed');
  }
}

/* ============ KEYBOARD ============ */
input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitBtn.click(); }
});

/* ============ DUST ============ */
const dust = document.getElementById("dust");
for (let i = 0; i < 28; i++) {
  const s = document.createElement("span");
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (16 + Math.random() * 20) + "s";
  s.style.animationDelay = Math.random() * 20 + "s";
  const size = 1 + Math.random() * 2;
  s.style.width = size + "px";
  s.style.height = size + "px";
  dust.appendChild(s);
}

/* ============ WELCOME ============ */
setTimeout(() => toast('info', 'Welcome to NIMAH FAMILY BOT'), 900);
</script>
